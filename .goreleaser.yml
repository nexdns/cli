version: 2

# Archives are named nexdns_<version>_<os>_<arch>, as scripts/install.sh expects.
project_name: nexdns

builds:
  - main: ./cmd/nexdns
    binary: nexdns
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X github.com/nexdns/cli/internal/version.Version={{.Version}}
      - -X github.com/nexdns/cli/internal/version.Commit={{.Commit}}
      - -X github.com/nexdns/cli/internal/version.Date={{.Date}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
      - "386"
    ignore:
      - goos: darwin
        goarch: "386"
      - goos: windows
        goarch: "386"

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]

homebrew_casks:
  - name: nexdns-cli
    binaries: [nexdns]
    repository:
      owner: nexdns
      name: homebrew-tap
      # GITHUB_TOKEN cannot write to another repository.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: "https://nexdns.tech/"
    description: "CLI tool for managing DNS zones and records via the NexDNS API"
    license: "Apache-2.0"
    # The binary is unsigned; clear the quarantine flag so macOS runs it.
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/nexdns"]
          end

dockers_v2:
  - images:
      - nexdns/cli
    dockerfile: Dockerfile.goreleaser
    platforms:
      - linux/amd64
      - linux/arm64
    tags:
      - "{{ .Version }}"
      - latest
    labels:
      org.opencontainers.image.title: "{{ .ProjectName }}"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "https://github.com/nexdns/cli"
      org.opencontainers.image.licenses: Apache-2.0

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
