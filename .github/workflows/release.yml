name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # GoReleaser builds the changelog from the commit range since the
          # previous tag, so it needs the full history rather than a shallow one.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # GoReleaser builds the images for two platforms in one buildx pass and
      # pushes them, so the runner needs emulation, a buildx builder and a
      # registry login before it starts. Without the login the run fails at the
      # push, after the GitHub release and the Homebrew cask have already been
      # published - a half-finished release is worse than none.
      # A missing secret reaches docker/login-action as an empty password and
      # surfaces as "Username and password required", which says nothing about
      # which secret, in which repository, or under which tab it was expected.
      - name: Registry credentials are present
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::DOCKERHUB_TOKEN is empty or unset in this repository."
            echo "It must be an Actions *repository* secret - Settings -> Secrets and"
            echo "variables -> Actions -> Repository secrets. A secret added under the"
            echo "Codespaces or Dependabot tab, or scoped to an environment this job"
            echo "does not declare, is invisible here."
            exit 1
          fi
          echo "DOCKERHUB_TOKEN is present (${#DOCKERHUB_TOKEN} characters)."

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          # Not a secret: the account name is already part of every image
          # name this workflow pushes.
          username: nexdns
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The built-in token is scoped to this repository and cannot push the
          # cask to nexdns/homebrew-tap; that needs its own token with write
          # access there. See docs guide "GitHub Publishing".
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
