name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The changelog is built from the commits since the previous tag.
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      # GoReleaser pushes the cask after the release is out, so a tap token that
      # does not work would leave a release without its cask.
      - name: Credentials are usable
        env:
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "${DOCKERHUB_TOKEN}" ]; then
            echo "::error::The DOCKERHUB_TOKEN repository secret is not set."
            exit 1
          fi
          status=$(curl -s -o /dev/null -w '%{http_code}' \
                   -H "Authorization: Bearer ${HOMEBREW_TAP_GITHUB_TOKEN}" \
                   https://api.github.com/repos/nexdns/homebrew-tap)
          if [ "${status}" != 200 ]; then
            echo "::error::HOMEBREW_TAP_GITHUB_TOKEN is not set, has expired or was revoked (HTTP ${status})."
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: nexdns
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITHUB_TOKEN cannot push the cask to nexdns/homebrew-tap.
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
